<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Title & Meta Tags -->
    <title>ResumeLint — Free Resume ATS Checker &amp; Analyzer | In-Browser WebAssembly</title>
    <meta
      name="title"
      content="ResumeLint — Free Resume ATS Checker &amp; Analyzer | In-Browser WebAssembly"
    />
    <meta
      name="description"
      content="Lint your resume before recruiters do. 100% private, client-side resume ATS checker and analyzer powered by WebAssembly. Free, deterministic scoring with zero server uploads."
    />
    <meta name="keywords" content="Resume ATS Checker, Resume Linter, ATS Resume Scanner, Free Resume Analyzer, WebAssembly ATS, Privacy-First Resume Tool, Resume Keywords, ATS Pass Rate" />
    <meta name="author" content="ResumeLint" />
    <meta name="theme-color" content="#059669" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ResumeLint — Free Resume ATS Checker &amp; Analyzer" />
    <meta
      property="og:description"
      content="Lint your resume before recruiters do. 100% private, client-side resume ATS evaluation powered by WebAssembly."
    />
    <meta property="og:image" content="./og-image.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ResumeLint — Free Resume ATS Checker &amp; Analyzer" />
    <meta
      name="twitter:description"
      content="Lint your resume before recruiters do. 100% private, client-side resume ATS evaluation powered by WebAssembly."
    />
    <meta name="twitter:image" content="./og-image.svg" />

    <!-- Favicons & Manifest -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./logo-icon.svg" />
    <link rel="manifest" href="./site.webmanifest" />

    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
